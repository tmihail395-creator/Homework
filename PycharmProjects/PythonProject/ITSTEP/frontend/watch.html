<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOID//NET — наблюдение</title>
<link rel="icon" href="images%20(1).png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="watch">
<div id="nav"></div>
<main class="wrap">
  <h2 class="glitch">Мы видим тебя</h2>
  <p id="whisper" class="whisper">…</p>

  <div class="grid">
    <section class="card">
      <h3>Твой отпечаток</h3>
      <table id="fp" class="fp"></table>
      <p class="muted small">Эти данные читаются в твоём браузере и никуда не уходят.</p>
    </section>
    <section class="card stat">
      <b id="timer">05:00</b>
      <span>до закрытия сеанса</span>
      <p class="muted small">Ты на сайте: <span id="since">0</span> сек.</p>
    </section>
  </div>
</main>
<div id="foot"></div>
<script src="script.js"></script>
</body>
</html>
